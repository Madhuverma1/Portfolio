
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Skills</title>
  <link rel="stylesheet" href="style.css" />
</head>
<style>
    body {
  margin: 0;
  padding: 0;
  background-color: #0a0a23;
  font-family: "Segoe UI", sans-serif;
  color: #fff;
}

.skills-section {
  padding: 60px 20px;
  text-align: center;
}

.section-title {
  font-size: 36px;
  margin-bottom: 40px;
  color: #ffffff;
}

.section-title span {
  color: #e91e63;
}

.skills-container {
  display: flex;
  flex-direction: column;
  gap: 25px;
  align-items: center;
}

.skill-card {
  background: #11152e;
  display: flex;
  width: 80%;
  max-width: 800px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s ease;
  text-align: left;
}

.skill-card:hover {
  transform: translateY(-5px);
}

.card-left {
  flex: 1;
  text-align: center;
  border-right: 1px solid rgba(255, 255, 255, 0.1);
  padding-right: 20px;
}

.card-left img {
  width: 50px;
  margin-bottom: 10px;
}

.card-left h3 {
  font-size: 20px;
  color: #00e0ff;
  margin: 0;
}

.card-right {
  flex: 2;
  padding-left: 25px;
}

.card-right ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.card-right ul li {
  font-size: 16px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

</style>
<body>
  <section class="skills-section">
    <h2 class="section-title">My <span>Skills</span></h2>
    <div class="skills-container">

      <div class="skill-card">
        <div class="card-left">
          <img src="https://cdn-icons-png.flaticon.com/512/732/732212.png" alt="Frontend Icon">
          <h3>Front-end</h3>
        </div>
        <div class="card-right">
          <ul>
            <li>HTML</li>
            <li>CSS3</li>
            <li>JavaScript</li>
            <li>Bootstrap</li>
          </ul>
        </div>
      </div>

      <div class="skill-card">
        <div class="card-left">
          <img src="https://cdn-icons-png.flaticon.com/512/732/732190.png" alt="Backend Icon">
          <h3>Back-end</h3>
        </div>
        <div class="card-right">
          <ul>
            <li>PHP</li>
            <li>MySQL</li>
            <li>Node.js</li>
          </ul>
        </div>
      </div>

      <div class="skill-card">
        <div class="card-left">
          <img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png" alt="WordPress Icon">
          <h3>WordPress</h3>
        </div>
        <div class="card-right">
          <ul>
            <li>Elementor</li>
            <li>WooCommerce</li>
            <li>Theme Customization</li>
          </ul>
        </div>
      </div>

      <div class="skill-card">
        <div class="card-left">
          <img src="https://cdn-icons-png.flaticon.com/512/5968/5968703.png" alt="Other Skills Icon">
          <h3>Other Skills</h3>
        </div>
        <div class="card-right">
          <ul>
            <li>Git & GitHub</li>
            <li>Figma</li>
            <li>Canva</li>
          </ul>
        </div>
      </div>

    </div>
  </section>
</body>
</html>
